name: Container CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: local/basalt-rag:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ env.IMAGE_NAME }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
      - name: Enforce high-severity vulnerability gate
        run: test "$(jq '[.matches[]? | select(.vulnerability.severity | ascii_upcase | IN("HIGH", "CRITICAL"))] | length' grype.json)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: basalt-rag-sbom
          path: |
            sbom.spdx.json
            grype.json
